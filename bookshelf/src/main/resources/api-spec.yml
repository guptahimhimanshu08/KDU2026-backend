openapi: 3.0.3
info:
  title: Library Management API
  version: v1
  description: API contract for managing books

paths:
  /api/v1/books/{id}:
    put:
      summary: Update a book
      description: |
        Updates an existing book.
        This operation is idempotent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique identifier of the book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookRequest"
      responses:
        "200":
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookResponse"
        "400":
          description: Invalid input
        "404":
          description: Book not found
        "409":
          description: Conflict while updating book

components:
  schemas:
    UpdateBookRequest:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin

    BookResponse:
      type: object
      properties:
        id:
          type: integer
          example: 10
        title:
          type: string
        author:
          type: string
