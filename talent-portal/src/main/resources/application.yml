spring:
  application:
    name: talent-portal

  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:talentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop

server:
  port: 8080

logging:
  level:
    root: INFO

jwt:
  secret: this_is_a_very_long_32_char_secret_key!!
  expiration-ms: 3600000


  
