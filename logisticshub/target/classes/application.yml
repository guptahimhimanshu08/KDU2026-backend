spring:
  datasource:
    url: jdbc:h2:mem:librarydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
  
  server:
    port: 8080

  logging:
    level:
      root: INFO

  jwt:
    secret: this_is_a_very_long_32_char_secret_key!!
    expiration-ms: 3600000